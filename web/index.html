<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Titre unique et accrocheur -->
    <title>Beraca's Valley - Salle de réception à Lubumbashi</title>
    
    <!-- Description (affichée dans les résultats Google) -->
    <meta name="description" content="Beraca's Valley est une salle de réception prestigieuse à Lubumbashi, RDC. Réservez en ligne, découvrez le menu et les appartements." />
    
    <!-- Balise canonique (évite le contenu dupliqué) -->
    <link rel="canonical" href="https://beraca.codemagic.app/" />

    <!-- Open Graph (partage sur les réseaux sociaux) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Beraca's Valley - Salle de réception" />
    <meta property="og:description" content="Salle de réception prestigieuse à Lubumbashi. Réservez en ligne." />
    <meta property="og:image" content="https://beraca.codemagic.app/favicon.png" />
    <meta property="og:url" content="https://beraca.codemagic.app/" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Beraca's Valley - Salle de réception" />
    <meta name="twitter:description" content="Salle de réception prestigieuse à Lubumbashi." />
    <meta name="twitter:image" content="https://beraca.codemagic.app/favicon.png" />

    <!-- Favicon (icône du navigateur) -->
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="favicon.png" />

    <!-- Sitemap -->
    <link rel="sitemap" type="application/xml" title="Sitemap" href="sitemap.xml" />

    <link rel="manifest" href="manifest.json" />
  </head>
  <body>
    <script>
      if (window.location.protocol == 'file:') {
        document.write('The app must be served over HTTP.');
      }
    </script>
    <script src="main.dart.js" type="application/javascript"></script>
  </body>
</html>
